{# ── 共享模板：record 级图片功能 JS（出货/装柜/入库三套订单共用） ── #}
{# 每个页面在使用前需先用 {% set %} 定义 api_prefix，再 {% include %}：
   {% set api_prefix = '/api/v1/xxx-orders' %}
   {% include '_record_image_script.html' %}

   外部依赖(common.js): escHtml, escAttr, confirmDialog, showImgPreview
   注意: 本模板不含 <script> 标签,需由父页面已有的 <script> 块包裹 #}
// ============================================================
// Template: _record_image_script.html (shared record image JS)
// API prefix: {{ api_prefix }}
// Shared record-level image functions with {{ api_prefix }} URL substitution
// ============================================================

// 1. badgeHtml — 生成 AI 比对状态徽章 HTML
// 2026-08-15: 改为按来源(source)分两套符号/颜色，与图片下方徽章保持一致：
//    本地 RapidFuzz: ✓/⚠/✗ + 浅色调   |   云端 DeepSeek: ⊛/◇/◆ + 深色调
function badgeHtml(status, reason, source) {
    // reason: AI 给出的判定依据(中文),可空；空时只显示状态标签
    // 2026-07-30 修复：徽章加 data-match-status 属性，与服务端模板首次渲染保持一致，
    // 避免 refreshRowMatchBadge 重建徽章后丢失属性（影响 .match-badge[data-match-status] 选择器）。
    reason = reason || '';
    source = source || 'local_fuzzy';
    var suffix = reason ? ' — ' + reason : '';
    var sym, colorMap;
    if (source === 'deepseek') {
        sym = {green: '⊛', yellow: '◇', red: '◆'};
        colorMap = {green: '#0d9488', yellow: '#b45309', red: '#b91c1c'};
    } else {
        sym = {green: '✓', yellow: '⚠', red: '✗'};
        colorMap = {green: '#16a34a', yellow: '#d97706', red: '#dc2626'};
    }
    var cls = 'match-badge match-badge-' + source;
    var baseStyle = 'font-size:1.05rem;font-weight:700;cursor:help;';
    if (status === 'green')  return '<span class="' + cls + '" data-match-status="green" data-match-source="' + source + '" title="图文相符' + suffix + '" style="color:' + colorMap.green + ';' + baseStyle + '">' + sym.green + '</span>';
    if (status === 'yellow') return '<span class="' + cls + '" data-match-status="yellow" data-match-source="' + source + '" title="存疑，请人工核对' + suffix + '" style="color:' + colorMap.yellow + ';' + baseStyle + '">' + sym.yellow + '</span>';
    if (status === 'red')    return '<span class="' + cls + '" data-match-status="red" data-match-source="' + source + '" title="可能不符' + suffix + '" style="color:' + colorMap.red + ';' + baseStyle + '">' + sym.red + '</span>';
    return '';
}

// 2. setRowMatchBadge — 把徽章贴到某行的 AI 比对 cell 上
// 先清掉旧徽章，再插入新徽章（status 为空则只清）
// 2026-07-30: 加 source 参数（默认 'local_fuzzy'），按来源分符号
// 2026-08-04: 改为先调 _ensureMatchColumn 动态插列（match-col 由 JS 维护，不靠服务端渲染）
function setRowMatchBadge(recordId, status, reason, source) {
    var tr = document.querySelector('.record-table tr[data-record-id="' + recordId + '"]');
    if (!tr) return;
    var table = tr.closest('table');
    var html = badgeHtml(status, reason, source || 'local_fuzzy');
    if (!html) {
        // status 为空 → 只清 dataset,不插列
        delete tr.dataset.matchBadgeHtml;
        return;
    }
    // 首次有匹配结果时:插 th + 目标 td + 兄弟空 td(列对齐),已有列时只更新目标 td
    _ensureMatchColumn(table, tr, html);
    tr.dataset.matchBadgeHtml = html;  // 让编辑保存时仍能恢复
}

// 2.5 _ensureMatchColumn — 在 table 内动态插入 AI 比对列(首次有匹配结果时)
// 位置: 规格 cell 之后(td[4])。表头 + 目标行 + 其他兄弟行(保持对齐)。
// 注: targetRow.querySelector 使用 'td.match-col' 而非 '.match-col',避免 CSS 同时匹配 th 选错。
function _ensureMatchColumn(table, targetRow, badgeHtml) {
    if (!table || !targetRow) return;
    var theadRow = table.querySelector('thead tr');
    // 表头宽容:smart-add modal 可能没有 spec-cell class,fallback th:nth-child(4)
    var specTh = theadRow && theadRow.querySelector('th.spec-cell, th:nth-child(4)');
    var specTd = targetRow.querySelector('td.spec-cell');
    var insertAfter = function (parent, ref, newEl) {
        if (ref && ref.nextElementSibling) parent.insertBefore(newEl, ref.nextElementSibling);
        else parent.appendChild(newEl);
    };

    // 1) 表头:尚未插入 th 时加一个
    if (theadRow && !theadRow.querySelector('th.match-col')) {
        var th = document.createElement('th');
        th.className = 'match-col';
        th.style.width = '55px';
        th.textContent = 'AI 比对';
        insertAfter(theadRow, specTh, th);
    }

    // 2) 目标行:已有 td 则只写,没有则先插再写
    var targetTd = targetRow.querySelector('td.match-col');
    if (!targetTd) {
        targetTd = document.createElement('td');
        targetTd.className = 'match-col';
        targetTd.style.textAlign = 'center';
        insertAfter(targetRow, specTd, targetTd);
    }
    targetTd.innerHTML = badgeHtml;

    // 3) 表内其他兄弟行:插空 td(对齐)
    table.querySelectorAll('tbody tr').forEach(function (tr) {
        if (tr === targetRow) return;
        if (tr.querySelector('td.match-col')) return;
        var emptyTd = document.createElement('td');
        emptyTd.className = 'match-col';
        emptyTd.style.textAlign = 'center';
        var ref = tr.querySelector('td.spec-cell');
        insertAfter(tr, ref, emptyTd);
    });
}

// 2.6 initRowMatchColumn — 页面刷新场景:服务端不渲染 match-col,
// 但 DB 里已有 match_status → 页面加载时由 JS 主动补建列并填徽章。
// 与 refreshRowMatchBadge 的区别:refresh =「更新」(假定 td 已存在);
//                            init   =「创建」(先 _ensureMatchColumn 插列,再 refresh 填徽章)。
function initRowMatchColumn(recordPk) {
    var imgs = document.querySelectorAll('.img-item-record[data-record-pk="' + recordPk + '"]');
    if (!imgs.length) return false;  // 没图就没徽章,不创建列
    var tr = document.querySelector('.record-table tr[data-record-id="' + recordPk + '"]');
    if (!tr) return false;
    var table = tr.closest('table');
    // 关键:先 _ensureMatchColumn(table, tr, '') 占位插列(确保兄弟行也对齐),
    //      再 refreshRowMatchBadge(recordPk) 填徽章 —— refresh 假设 td 已存在。
    _ensureMatchColumn(table, tr, '');
    refreshRowMatchBadge(recordPk);
    return true;
}

// 2.7 initAllMatchColumns — 页面加载时一次性扫所有 img-item-record,对每个有图的 record 调用 initRowMatchColumn
function initAllMatchColumns() {
    var pks = new Set();
    document.querySelectorAll('.img-item-record[data-record-pk]').forEach(function (img) {
        pks.add(img.getAttribute('data-record-pk'));
    });
    pks.forEach(function (pk) {
        initRowMatchColumn(pk);
    });
}

// 3. refreshRowMatchBadge — 重算并刷新某个 record 的行级 AI 比对徽章
// 规则: 扫描该 record 所有 img-item-record 里的 .match-badge[data-match-status]，
//       红牌/黄牌 + 已人工确认 → 视为 green；其他按原值。取最高（green > yellow > red）。
// 2026-07-30 改造: 行级徽章按来源(最差档图的 match_source)分两套符号:
//    本地 RapidFuzz: ✓/⚠/✗（浅色）
//    云端 DeepSeek:  ⊛/◇/◆（深色）
// 6 种状态图标 = 3 档 × 2 来源。
function refreshRowMatchBadge(recordPk) {
    var imgs = document.querySelectorAll('.img-item-record[data-record-pk="' + recordPk + '"]');
    if (!imgs.length) return;
    var rank = {green: 3, yellow: 2, red: 1};
    var best = 'red';
    var bestSource = 'local_fuzzy';
    var bestCount = {green: 0, yellow: 0, red: 0};
    imgs.forEach(function(img) {
        var badge = img.querySelector('.match-badge[data-match-status]');
        if (!badge) return;
        var s = badge.getAttribute('data-match-status');
        var src = badge.getAttribute('data-match-source') || 'local_fuzzy';
        // 红牌/黄牌 + 已人工确认 → 视为 green（人工裁决覆盖 AI 判定）
        if ((s === 'red' || s === 'yellow') && img.querySelector('.manual-verified-marker')) {
            s = 'green';
        }
        if (rank[s] > rank[best]) {
            best = s;
            bestSource = src;
        }
        bestCount[s] += 1;
    });
    var tr = document.querySelector('.record-table tr[data-record-id="' + recordPk + '"]');
    if (!tr) return;
    // 2026-08-04:用 'td.match-col'(不用 '.match-col')避开 th 选择器干扰,即便有 th.match-col 也不会选错
    var cell = tr.querySelector('td.match-col');
    if (!cell) return;
    cell.querySelectorAll('.match-badge').forEach(function(b) { b.remove(); });
    // 2026-08-03:统计该 record 下「已人工确认」的图。标记元素为 .manual-undo-btn（服务端/JS 确认后生成），
    //            兼容旧 .manual-verified-marker。
    var verifiedCount = document.querySelectorAll(
        '.img-item-record[data-record-pk="' + recordPk + '"] .manual-undo-btn, ' +
        '.img-item-record[data-record-pk="' + recordPk + '"] .manual-verified-marker'
    ).length;
    var html;
    if (verifiedCount > 0) {
        // 人工确认后,行级 match_status 图标换为 👤 人头(覆盖 AI 判定)
        html = '<span class="match-badge match-badge-overridden" data-match-status="green" data-overridden-by-human="1" title="人工确认通过(覆盖原始 ' + best + ')" style="color:#10b981;font-size:1.1rem;">\u{1F464}</span>';
    } else {
        var reason = '本行 ' + bestCount.green + '绿 / ' + bestCount.yellow + '黄 / ' + bestCount.red + '红';
        html = badgeHtml(best, reason, bestSource);
    }
    if (html) {
        cell.insertAdjacentHTML('afterbegin', html);
        tr.dataset.matchBadgeHtml = html;
    }
}

// 4. bindDeleteImageButtons — 重新绑定删除图片按钮事件
function bindDeleteImageButtons() {
    document.querySelectorAll('.del-img-btn').forEach(function(btn) {
        if (btn._bound) return;
        btn._bound = true;
        btn.addEventListener('click', function() {
            var clickedBtn = this;
            var imageId = clickedBtn.getAttribute('data-image-id');
            // 兼容两种容器: 普通订单图片用 .img-item，AI 识别图片用 .ai-img-wrap
            var imgDiv = clickedBtn.closest('.img-item, .ai-img-wrap');
            // 行级图(record)才有"删完需清 record-image-btn 红框"语义
            var imgItemRecord = clickedBtn.closest('.img-item-record');
            var recordPk = imgItemRecord ? imgItemRecord.getAttribute('data-record-pk') : null;
            confirmDialog('确定要删除这张图片吗？', function() {
                fetch('{{ api_prefix }}/images/' + imageId, {
                    method: "DELETE"
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.success) {
                        if (imgDiv) {
                            imgDiv.style.transition = 'opacity 0.3s';
                            imgDiv.style.opacity = "0";
                            setTimeout(function() {
                                imgDiv.remove();
                                // 行级图删完后,如该 record 已无任何图片,把 🖼️ 按钮的 has-image 红框去掉
                                if (recordPk) {
                                    var remaining = document.querySelectorAll(
                                        '.img-item-record[data-record-pk="' + recordPk + '"]').length;
                                    if (remaining === 0) {
                                        var imgBtn = document.querySelector(
                                            '.record-image-btn[data-record-id="' + recordPk + '"]');
                                        if (imgBtn) imgBtn.classList.remove('has-image');
                                    }
                                }
                            }, 300);
                        } else {
                            // 兜底: 没找到容器，直接刷新页面
                            location.reload();
                        }
                    } else { alert('删除失败：' + (data.error || '')); }
                }).catch(function(err) { alert('请求失败：' + err); });
            });
        });
    });
}

// 5. setImgCols — 图片列数切换（每订单独立记忆，持久化到数据库）
window.setImgCols = function(btn, cols) {
    var area = btn.closest('.order-images-area');
    if (!area) return;
    var orderId = area.dataset.orderId;
    area.classList.remove('columns-1','columns-2','columns-3','columns-4','columns-5');
    area.classList.add('columns-' + cols);
    area.dataset.cols = cols;
    area.querySelectorAll('.img-col-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    // 持久化到数据库
    if (orderId) {
        fetch('{{ api_prefix }}/' + orderId, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({img_cols: cols})
        });
    }
};

// 6. applyRecordImageOverlay — 给 record 级图片叠加"商品名 + 规格"文字
// 布局：商品名在图片顶部、规格在图片底部，两者均红色字体
// 参数 productName / specification 可省略 → 自动从 record 行反查
function applyRecordImageOverlay(imgItem, recordPk, productName, specification) {
    if (!imgItem || !imgItem.classList.contains('img-item-record')) return;
    if (imgItem.querySelector('.img-overlay-name')) return;  // 防重复
    if (productName === undefined || specification === undefined) {
        var row = document.querySelector('.record-table tr[data-record-id="' + recordPk + '"]');
        if (row) {
            // 用 class 选（不再依赖 td 位置）
            productName = ((row.querySelector('.product-name-cell') || {}).textContent || '').trim();
            specification = ((row.querySelector('.spec-cell') || {}).textContent || '').trim();
        } else {
            productName = '';
            specification = '';
        }
    }
    if (!productName && !specification) return;
    // 找到图区容器(.img-photo)，叠加文字需要相对它定位；不在则兜底用 imgItem
    var photoEl = imgItem.querySelector('.img-photo') || imgItem;
    // 顶部：商品名（textContent 赋值天然防 XSS）
    if (productName) {
        var nameEl = document.createElement('div');
        nameEl.className = 'img-overlay-name';
        nameEl.textContent = productName;
        photoEl.appendChild(nameEl);
    }
    // 底部：规格
    if (specification) {
        var specEl = document.createElement('div');
        specEl.className = 'img-overlay-spec';
        specEl.textContent = specification;
        photoEl.appendChild(specEl);
    }
}

// 7. applyAllRecordImageOverlays — 页面加载时给所有 server-render 的 record 图挂叠加
function applyAllRecordImageOverlays() {
    document.querySelectorAll('.shipping-page .img-item-record[data-record-pk]').forEach(function(item) {
        var pk = item.getAttribute('data-record-pk');
        applyRecordImageOverlay(item, pk);
    });
}

// 8. updateImageBadge — 根据判别结果刷新图片下方的判别图标。返回 true=成功, false=未找到元素
function updateImageBadge(imgId, status, score, reason, source) {
    var imgItem = document.querySelector('.img-item-record[data-image-id="' + imgId + '"]');
    if (!imgItem) return false;
    var metaRow1 = imgItem.querySelector('.img-meta-row-1');
    if (!metaRow1) return false;
    // 移除旧 badge
    var oldBadge = metaRow1.querySelector('.match-badge');
    if (oldBadge) oldBadge.remove();
    // 构造新 badge
    var srcLabel = source === 'deepseek' ? '云端 DeepSeek' : '本地 RapidFuzz';
    var sym = source === 'deepseek'
        ? {green: '⊛', yellow: '◇', red: '◆'}
        : {green: '✓', yellow: '⚠', red: '✗'};
    var colorMap = source === 'deepseek'
        ? {green: '#0d9488', yellow: '#b45309', red: '#b91c1c'}
        : {green: '#16a34a', yellow: '#d97706', red: '#dc2626'};
    if (status && sym[status]) {
        var span = document.createElement('span');
        span.className = 'match-badge match-badge-' + source;
        span.setAttribute('data-match-status', status);
        span.setAttribute('data-match-source', source);
        span.title = (status === 'green' ? '图文相符' : status === 'yellow' ? '存疑' : '可能不符')
            + '（' + srcLabel + '）' + (reason ? ' — ' + reason : '');
        span.style.cssText = 'color:' + colorMap[status] + ';font-size:1.05rem;font-weight:700;cursor:help;';
        span.textContent = sym[status];
        // 插入到 row-1 的最前面
        metaRow1.insertBefore(span, metaRow1.firstChild);
    }
    // 同时刷新该记录行的徽章(带 source,保证行级图标与图下徽章一致)
    var recordPk = imgItem.getAttribute('data-record-pk');
    if (recordPk) setRowMatchBadge(recordPk, status, null, source);
    return true;
}

// 8.1 refreshImageMatchUI — 局部刷新某张图片的「图下判别图标 + 行级图标 + 按钮可见性」
// 与 updateImageBadge 的区别: 额外按新 status 重建「✓ 确认通过 / 👤 已确认 / 💡 提示词优化」按钮，
// 并把行级徽章改为聚合刷新(尊重人工确认 👤)。供 AI判别 / 模糊匹配 两个手动按钮复用。
// opts: { bgColor: 'black'|'white'|undefined, humanVerified: bool|undefined }
function refreshImageMatchUI(imgId, status, score, reason, source, opts) {
    opts = opts || {};
    var item = document.querySelector('.img-item-record[data-image-id="' + imgId + '"]');
    if (!item) return false;
    var row1 = item.querySelector('.img-meta-row-1');
    if (!row1) return false;
    var recordPk = item.getAttribute('data-record-pk');

    // 人工确认状态:优先用传入值,否则看 DOM 是否已有「👤 已确认」(manual-undo-btn)
    var humanVerified = (typeof opts.humanVerified === 'boolean')
        ? opts.humanVerified
        : !!item.querySelector('.manual-undo-btn');

    // 1) 清掉旧徽章 / 确认 / 撤销 / 提示词按钮(保留 bg-color-tag,避免 AI 判别时黑/白底标签被误删)
    row1.querySelectorAll('.match-badge, .manual-confirm-btn, .manual-undo-btn, .gen-prompt-btn').forEach(function(el) { el.remove(); });

    // 2) 判别图标(图下,图标 #1)
    var badge = document.createElement('span');
    if (humanVerified && (status === 'yellow' || status === 'red')) {
        // 人工已确认覆盖:仍显示 👤(绿),不让 AI 结果回退掉人工裁决
        badge.className = 'match-badge match-badge-' + source + ' match-badge-overridden';
        badge.setAttribute('data-match-status', 'green');
        badge.setAttribute('data-match-source', source);
        badge.setAttribute('data-overridden-by-human', '1');
        badge.title = '人工确认通过(覆盖原始 ' + status + ')';
        badge.style.cssText = 'color:#10b981;font-size:1.05rem;font-weight:700;cursor:help;';
        badge.textContent = '👤';
    } else if (status) {
        var srcLabel = source === 'deepseek' ? '云端 DeepSeek' : '本地 RapidFuzz';
        var sym = source === 'deepseek'
            ? {green: '⊛', yellow: '◇', red: '◆'}
            : {green: '✓', yellow: '⚠', red: '✗'};
        var colorMap = source === 'deepseek'
            ? {green: '#0d9488', yellow: '#b45309', red: '#b91c1c'}
            : {green: '#16a34a', yellow: '#d97706', red: '#dc2626'};
        badge.className = 'match-badge match-badge-' + source;
        badge.setAttribute('data-match-status', status);
        badge.setAttribute('data-match-source', source);
        badge.title = (status === 'green' ? '图文相符' : status === 'yellow' ? '存疑' : '可能不符')
            + '（' + srcLabel + '）' + (reason ? ' — ' + reason : '');
        badge.style.cssText = 'color:' + colorMap[status] + ';font-size:1.05rem;font-weight:700;cursor:help;';
        badge.textContent = sym[status];
    }
    row1.appendChild(badge);

    // 3) 背景色标签:传入则刷新,否则保留现有(不动)
    if (opts.bgColor) {
        var oldTag = row1.querySelector('.bg-color-tag');
        if (oldTag) oldTag.remove();
        var tag = document.createElement('span');
        tag.className = 'bg-color-tag';
        tag.title = '自动识别背景色';
        if (opts.bgColor === 'black') {
            tag.style.cssText = 'padding:1px 6px;font-size:0.65rem;border-radius:3px;background:#2d3436;color:#fff;';
            tag.textContent = '⬛ 黑底';
        } else {
            tag.style.cssText = 'padding:1px 6px;font-size:0.65rem;border-radius:3px;background:#f1f3f5;color:#2d3436;border:1px solid #ced4da;';
            tag.textContent = '⬜ 白底';
        }
        row1.appendChild(tag);
    }

    // 4) 按钮可见性:黄/红 牌才需要「确认 / 已确认」
    if (status === 'yellow' || status === 'red') {
        if (humanVerified) {
            var undo = document.createElement('button');
            undo.type = 'button';
            undo.className = 'manual-undo-btn lock-hide';
            undo.setAttribute('data-verified-marker', imgId);
            undo.setAttribute('data-undo-btn', imgId);
            undo.title = '人工已确认(覆盖 ' + status + ');点击撤销';
            undo.style.cssText = 'padding:2px 8px;font-size:0.7rem;background:#10b981;color:#fff;border:none;border-radius:4px;cursor:pointer;';
            undo.textContent = '👤 已确认';
            row1.appendChild(undo);
            var gp = document.createElement('button');
            gp.type = 'button';
            gp.className = 'gen-prompt-btn lock-hide';
            gp.style.cssText = 'margin-left:.35rem;padding:.1rem .5rem;font-size:.75rem;background:#7c3aed;color:#fff;border:none;border-radius:4px;cursor:pointer;';
            gp.setAttribute('data-gen-prompt', imgId);
            gp.textContent = '💡 提示词优化';
            row1.appendChild(gp);
        } else {
            var conf = document.createElement('button');
            conf.type = 'button';
            conf.className = 'manual-confirm-btn lock-hide';
            conf.setAttribute('data-image-id', imgId);
            conf.setAttribute('data-confirm-btn', imgId);
            conf.textContent = '✓ 确认通过';
            row1.appendChild(conf);
        }
    }

    // 5) 重新绑定新按钮
    bindManualConfirmButtons();
    if (typeof bindGenPromptButtons === 'function') bindGenPromptButtons();

    // 6) 行级徽章(图标 #2):聚合该 record 所有图 + 尊重人工确认 👤
    if (recordPk) refreshRowMatchBadge(recordPk);
    return true;
}

// 8.5 pollRecordImageMatch — 上传后异步 OCR+AI 的轮询刷新
// 后端上传即返回 processing:true,这里每 ~1.2s 查一次 /images/<id>/match-status,
// 完成后把"识别中"占位换成真实徽章/背景色,并刷新该行级徽章(局部刷新,不整页 reload)。
function pollRecordImageMatch(imageId, recordPk) {
    var url = '{{ api_prefix }}/images/' + imageId + '/match-status';
    var tries = 0;
    var maxTries = 100;  // ~120s 上限,超时停止轮询(任务卡死/重启兜底)
    var timer = setInterval(function() {
        tries++;
        fetch(url).then(function(r) { return r.json(); }).then(function(d) {
            if (!d || !d.success) { clearInterval(timer); return; }
            if (d.processing) {
                if (tries >= maxTries) clearInterval(timer);
                return;
            }
            clearInterval(timer);
            applyAsyncMatchResult(imageId, d.image || {}, recordPk);
        }).catch(function() {
            if (tries >= maxTries) clearInterval(timer);
        });
    }, 1200);
}

// 8.6 applyAsyncMatchResult — 把异步结果落到 DOM(替换"识别中"占位)
function applyAsyncMatchResult(imageId, img, recordPk) {
    var item = document.querySelector('.img-item-record[data-image-id="' + imageId + '"]');
    if (!item) return;
    var row1 = item.querySelector('.img-meta-row-1');
    if (!row1) return;
    // 1) 移除"识别中"占位
    var pending = row1.querySelector('.match-badge-processing');
    if (pending) pending.remove();
    // 2) 写真实徽章(复用 updateImageBadge 的来源符号逻辑)
    var status = (img.match_status || '').trim();
    var source = img.match_source || 'local_fuzzy';
    if (status) {
        updateImageBadge(imageId, status, img.match_score, img.reason, source);
    }
    // 3) 背景色标签
    if (img.bg_color && !row1.querySelector('.bg-color-tag')) {
        var tag = document.createElement('span');
        tag.className = 'bg-color-tag';
        tag.title = '自动识别背景色';
        if (img.bg_color === 'black') {
            tag.style.cssText = 'padding:1px 6px;font-size:0.65rem;border-radius:3px;background:#2d3436;color:#fff;';
            tag.textContent = '⬛ 黑底';
        } else {
            tag.style.cssText = 'padding:1px 6px;font-size:0.65rem;border-radius:3px;background:#f1f3f5;color:#2d3436;border:1px solid #ced4da;';
            tag.textContent = '⬜ 白底';
        }
        row1.appendChild(tag);
    }
    // 4) 黄/红牌未人工确认 → 补"✓ 确认通过"按钮
    if ((status === 'red' || status === 'yellow') && !item.querySelector('.manual-confirm-btn, .manual-undo-btn')) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'manual-confirm-btn lock-hide';
        btn.setAttribute('data-image-id', imageId);
        btn.setAttribute('data-confirm-btn', imageId);
        btn.textContent = '✓ 确认通过';
        row1.appendChild(btn);
        bindManualConfirmButtons();
    }
    // 5) 重新聚合该行级徽章(多图取最差档)
    if (recordPk) refreshRowMatchBadge(recordPk);
}

                    '<button type="button" class="fuzzy-match-btn lock-hide" data-fuzzy-match="' + escAttr(img.image_id) + '" title="用 RapidFuzz 对该图 OCR 文字与商品名/规格做本地模糊匹配" style="padding:.1rem .5rem;font-size:.7rem;background:#74b9ff;color:#fff;border:none;border-radius:4px;cursor:pointer;">模糊匹配</button>' +
                    '<button type="button" class="ai-judge-btn lock-hide" data-ai-judge="' + escAttr(img.image_id) + '" title="将 OCR 文字发给 DeepSeek 大模型进行 AI 判别" style="padding:.1rem .5rem;font-size:.7rem;background:#a29bfe;color:#fff;border:none;border-radius:4px;cursor:pointer;">AI判别</button>' +
                    '<button type="button" class="ocr-detail-btn lock-hide" data-ocr-detail="' + escAttr(img.image_id) + '" title="查看 OCR 原文 / 提示词 / 推理结果" style="padding:.1rem .5rem;font-size:.7rem;background:#dfe6e9;color:#2d3436;border:1px solid #b2bec3;border-radius:4px;cursor:pointer;">详情</button>' +

    (function(){

// 11. recordImageUploaded — 商品行(record)级图片上传成功回调
// 弹框 _image_upload_modal.html 在 record 模式下，上传成功后调此函数
// 整体图区策略: 订单明细表下方只一个 📷 区域，所有 record 级图混在那里显示
window.recordImageUploaded = function(data, recordPk, orderPk) {
    if (!data.success || !data.images || !data.images.length) return;
    // 从 record 行读 product_name + specification，叠加到新图上
    var row = document.querySelector('.record-table tr[data-record-id="' + recordPk + '"]');
    var productName = '';
    var specification = '';
    if (row) {
        // 用 class 选，不再依赖 td 位置（早期 tds[1]/tds[2] 会跟 eco-col 重叠错列）
        productName = ((row.querySelector('.product-name-cell') || {}).textContent || '').trim();
        specification = ((row.querySelector('.spec-cell') || {}).textContent || '').trim();
    }
    appendOrderImageArea(orderPk, data.images, {
        record_pk: recordPk,
        product_name: productName,
        specification: specification,
    });
    // 行级上传后: 拿后端返回的最新 match_status 刷新该行徽章
    // (一次上传可能多张，score 高的覆盖，这里只取最近一次结果——单次上传上限 1 张 OR 取最优)
    var bestStatus = '';
    var bestScore = -1;
    var bestSource = 'local_fuzzy';
    data.images.forEach(function(img) {
        var s = img.match_status || '';
        var sc = (typeof img.match_score === 'number') ? img.match_score : -1;
        if (s && (sc > bestScore || (sc === bestScore && s === 'green'))) {
            bestStatus = s;
            bestScore = sc;
            bestSource = img.match_source || 'local_fuzzy';
        }
    });
    if (bestStatus) setRowMatchBadge(recordPk, bestStatus, null, bestSource);
    // 异步处理中的图片:启动轮询,完成后局部刷新徽章/背景色/行徽章
    // (出货页走异步:上传即返回 processing:true;装柜/入库仍同步返回,无 processing 标记则不轮询)
    data.images.forEach(function(img) {
        if (img.processing) pollRecordImageMatch(img.image_id, recordPk);
    });
    // 标记该行 🖼️ 按钮为"已上传"状态(加红框); 删除全部图片后清除
    var imgBtn = document.querySelector('.record-image-btn[data-record-id="' + recordPk + '"]');
    if (imgBtn) imgBtn.classList.add('has-image');
};

// 12. bindManualConfirmButtons — 人工确认/撤销按钮绑定
// 2026-07-30 改造: marker 可点击 toggle 切换 — 点 marker 撤销人工确认，回退到「✓ 确认通过」按钮
function bindManualConfirmButtons() {
    document.querySelectorAll('.manual-confirm-btn:not([data-bound])').forEach(function(btn) {
        btn.setAttribute('data-bound', '1');
        btn.addEventListener('click', function() {
            var imgId = this.getAttribute('data-image-id');
            var self = this;
            self.disabled = true;
            self.textContent = '确认中...';
            fetch('{{ api_prefix }}/images/' + imgId + '/manual-verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({verified: true})
            }).then(function(res) { return res.json(); }).then(function(data) {
                if (data.success) {
                    _replaceConfirmBtnWithMarker(self, imgId);
                } else {
                    self.disabled = false;
                    self.textContent = '✓ 确认通过';
                    alert('确认失败: ' + (data.error || ''));
                }
            }).catch(function() {
                self.disabled = false;
                self.textContent = '✓ 确认通过';
                alert('请求失败');
            });
        });
    });
    // 已有 已确认按钮（刷新页面 / 已确认过的图）→ 绑定 toggle 撤销
    document.querySelectorAll('.manual-undo-btn:not([data-toggle-bound])').forEach(function(btn) {
        btn.setAttribute('data-toggle-bound', '1');
        btn.addEventListener('click', function() {
            var imgId = this.getAttribute('data-verified-marker');
            if (!imgId) return;
            var self = this;
            var originalText = self.textContent;
            self.textContent = '撤销中...';
            self.disabled = true;
            fetch('{{ api_prefix }}/images/' + imgId + '/manual-verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({verified: false})
            }).then(function(res) { return res.json(); }).then(function(data) {
                self.disabled = false;
                if (data.success) {
                    _replaceUndoBtnWithConfirmBtn(self, imgId);
                } else {
                    self.textContent = originalText;
                    alert('撤销失败: ' + (data.error || ''));
                }
            }).catch(function() {
                self.disabled = false;
                self.textContent = originalText;
                alert('请求失败');
            });
        });
    });
}

// 13. _replaceConfirmBtnWithMarker — 确认后把按钮替换为 marker（同时加 💡 提示词优化 按钮）
function _replaceConfirmBtnWithMarker(btn, imgId) {
    var metaRow1 = btn.closest('.img-meta-row-1');
    if (!metaRow1) {
        var imgMeta = btn.closest('.img-meta');
        if (imgMeta) metaRow1 = imgMeta.querySelector('.img-meta-row-1');
    }
    if (!metaRow1) return;
    var undoBtn = document.createElement('button');
    undoBtn.className = 'manual-undo-btn lock-hide';
    undoBtn.setAttribute('data-verified-marker', imgId);
    undoBtn.setAttribute('data-undo-btn', imgId);
    undoBtn.style.cssText = 'padding:2px 8px;font-size:0.7rem;background:#10b981;color:#fff;border:none;border-radius:4px;cursor:pointer;';
    undoBtn.textContent = '\u{1F464} 已确认';
    var badge = metaRow1.querySelector('.match-badge');
    var origStatus = badge ? badge.getAttribute('data-match-status') : '';

    btn.parentNode.replaceChild(undoBtn, btn);
    // 绑定撤销事件
    undoBtn.setAttribute('data-toggle-bound','1');
    undoBtn.addEventListener('click', function(){
        var self=this; self.disabled=true; self.textContent='撤销中...';
        fetch('{{ api_prefix }}/images/'+imgId+'/manual-verify',{
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({verified:false})
        }).then(function(r){return r.json();}).then(function(d){
            self.disabled=false;
            if(d.success){ _replaceUndoBtnWithConfirmBtn(self,imgId); }
            else { self.textContent='\u{1F464} 已确认'; alert('撤销失败: '+(d.error||'')); }
        }).catch(function(){ self.disabled=false; self.textContent='\u{1F464} 已确认'; });
    });
    _upgradeBadgeAfterConfirm(metaRow1, imgId);
    var genBtn = document.createElement('button');
    genBtn.type='button'; genBtn.className='gen-prompt-btn lock-hide';
    genBtn.style.cssText = 'margin-left:.35rem;padding:.1rem .5rem;font-size:.75rem;background:#7c3aed;color:#fff;border:none;border-radius:4px;cursor:pointer;';
    genBtn.setAttribute('data-gen-prompt', imgId);
    genBtn.textContent = '\u{1F4A1} 提示词优化';
    metaRow1.appendChild(genBtn);
    if (typeof bindGenPromptButtons === 'function') bindGenPromptButtons();
    var imgItem = metaRow1.closest('.img-item-record');
    var recordPk = imgItem && imgItem.getAttribute('data-record-pk');
    if (recordPk) refreshRowMatchBadge(recordPk);
}

// 14. _replaceUndoBtnWithConfirmBtn — 撤销人工确认，恢复为「✓ 确认通过」按钮
function _replaceUndoBtnWithConfirmBtn(undoBtn, imgId) {
    var metaRow1 = undoBtn.closest('.img-meta-row-1');

        var imgMeta = undoBtn.closest('.img-meta');
        if (imgMeta) metaRow1 = imgMeta.querySelector('.img-meta-row-1');

    var confirmBtn = document.createElement('button');

    confirmBtn.setAttribute('data-image-id', imgId);
    confirmBtn.setAttribute('data-confirm-btn', imgId);
    confirmBtn.style.cssText = 'background:#10b981;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:0.72rem;font-weight:600;';
    confirmBtn.textContent = '\u2713 确认通过';
    undoBtn.parentNode.replaceChild(confirmBtn, undoBtn);
    confirmBtn.addEventListener('click', function(){
        var self=this; self.disabled=true; self.textContent='确认中...';
        fetch('{{ api_prefix }}/images/'+imgId+'/manual-verify',{
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({verified:true})
        }).then(function(r){return r.json();}).then(function(d){
            if(d.success){ _replaceConfirmBtnWithMarker(self,imgId); }
            else { self.disabled=false; self.textContent='\u2713 确认通过'; alert('确认失败: '+(d.error||'')); }
        }).catch(function(){ self.disabled=false; self.textContent='\u2713 确认通过'; });
    });
    _downgradeBadgeAfterUnconfirm(metaRow1, imgId);
    var genBtn = metaRow1.querySelector('.gen-prompt-btn[data-gen-prompt="'+imgId+'"]');
    if (genBtn) genBtn.remove();
    var imgItem = metaRow1.closest('.img-item-record');
    var recordPk = imgItem && imgItem.getAttribute('data-record-pk');
    if (recordPk) refreshRowMatchBadge(recordPk);
}

// 15. _upgradeBadgeAfterConfirm — 确认后把单图徽章改为 👤 人头图标
// 2026-07-31 升级: yellow/red + human_verified → 👤 green
function _upgradeBadgeAfterConfirm(row, imgId) {
    var badge = row.querySelector('.match-badge');
    if (!badge) return;
    var origStatus = badge.getAttribute('data-match-status');
    if (origStatus !== 'yellow' && origStatus !== 'red') return;
    badge.classList.add('match-badge-overridden');
    badge.setAttribute('data-match-status', 'green');
    badge.setAttribute('data-overridden-by-human', '1');
    badge.style.color = '#10b981';
    badge.textContent = '\u{1F464}';  // 👤 人工确认图标
    badge.title = '人工确认通过(覆盖原始 ' + origStatus + ')';
}

// 16. _downgradeBadgeAfterUnconfirm — 撤销后把单图徽章降级回原色
// 2026-07-30: 从服务器重新拿图数据，无重载页面
function _downgradeBadgeAfterUnconfirm(row, imgId) {
    var badge = row.querySelector('.match-badge');
    if (!badge) return;
    if (badge.getAttribute('data-overridden-by-human') !== '1') return;  // 没被覆盖过，不动
    // 重新从服务器拿图（没专门的 single image API，借用 images-area 端点拿到所有图，自己挑）
    var imgItem = row.closest('.img-item-record');
    var recordPk = imgItem && imgItem.getAttribute('data-record-pk');
    if (!recordPk) return;
    fetch('{{ api_prefix }}/records/' + recordPk + '/images-area')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var img = (data.images || []).find(function(x) { return String(x.id) === String(imgId); });
            if (!img) return;
            _renderBadgeFromImage(badge, img);
            // 同步行级徽章
            refreshRowMatchBadge(recordPk);
        });
}

// 17. _renderBadgeFromImage — 用 img 对象重新渲染 badge（共用逻辑）
function _renderBadgeFromImage(badge, img) {
    var status = img.match_status || '';
    var reason = img.reason || '';
    var ms = img.match_source || 'local_fuzzy';
    var srcLabel = ms === 'deepseek' ? '云端 DeepSeek' : '本地 RapidFuzz';
    var sym = ms === 'deepseek'
        ? {green: '⊛', yellow: '◇', red: '◆'}
        : {green: '✓', yellow: '⚠', red: '✗'};
    badge.className = 'match-badge match-badge-' + ms;
    badge.removeAttribute('data-overridden-by-human');
    if (status === 'green') {
        badge.setAttribute('data-match-status', 'green');
        badge.style.color = '#16a34a';
        badge.textContent = sym.green;
        badge.title = '图文相符(' + srcLabel + ')' + (reason ? ' — ' + reason : '');
    } else if (status === 'yellow') {
        badge.setAttribute('data-match-status', 'yellow');
        badge.style.color = '#d97706';
        badge.textContent = sym.yellow;
        badge.title = '存疑，请人工核对(' + srcLabel + ')' + (reason ? ' — ' + reason : '');
    } else if (status === 'red') {
        badge.setAttribute('data-match-status', 'red');
        badge.style.color = '#dc2626';
        badge.textContent = sym.red;
        badge.title = '可能不符(' + srcLabel + ')' + (reason ? ' — ' + reason : '');
    } else {
        badge.style.display = 'none';
    }
}

// 19. openCategoryPromptModal — 打开分类提示词编辑器(2026-08-09 简化版)
//
// 2026-08-09 简化:弹框只保留与 category_prompts 表相关的内容。
//   - 移除:OCR 模板说明 / 作用范围下拉 / 品类编号 / 品名关键词 / 规格通配输入
//          / 已有提示词列表(全品类管理请去 /manage/category-prompts)
//   - 保留:分类显示 + 提示词正文编辑框 + 保存
//
// 后端 generate-prompt-suggestion 端点已经把 prompt_text 直接从
// category_prompts 表加载,弹框主编辑框就是用户已填的内容(可微调)。
function openCategoryPromptModal(sug, imgId) {
    var existing = document.getElementById('categoryPromptModal');
    if (existing) existing.remove();
    var currentPrompt = sug.prompt_text || '';
    var isEmpty = !currentPrompt.trim();
    var html = ''
        + '<div id="categoryPromptModal" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center;">'
        + '<div style="background:#fff;border-radius:8px;padding:1.2rem 1.4rem;max-width:560px;width:92%;box-shadow:0 8px 24px rgba(0,0,0,.25);">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;">'
        + '<h3 style="margin:0;color:#7c3aed;">💡 编辑分类提示词</h3>'
        + '<button id="cp_close_x" type="button" style="background:none;border:none;font-size:1.2rem;color:#9ca3af;cursor:pointer;line-height:1;padding:0 .2rem;" title="关闭">✕</button>'
        + '</div>'
        // 分类信息(只读):从 category_prompts 表自动确定
        + '<div id="cp_category_info" style="font-size:.82rem;color:#636e72;margin-bottom:.6rem;padding:.4rem .6rem;background:#f5f3ff;border-left:3px solid #7c3aed;border-radius:3px;">'
        + '<span style="color:#9ca3af;">分类编号</span> '
        + '<span id="cp_category_code" style="font-family:monospace;font-weight:600;color:#1f2937;">' + escHtml(sug.category_code || '（未识别）') + '</span>'
        + (sug.product_name_keyword ? ' &nbsp;|&nbsp; <span style="color:#9ca3af;">品名</span> ' + escHtml(sug.product_name_keyword) : '')
        + '</div>'
        // 提示词正文(从 category_prompts 表加载,主编辑区)
        + '<label style="font-size:.82rem;font-weight:600;display:block;margin-bottom:.3rem;">提示词正文(可编辑):</label>'
        + '<textarea id="cp_prompt_text" rows="7" autofocus '
        +   'placeholder="' + (isEmpty ? '该分类还没提示词,在这里输入内容后点保存。&#10;例:环保等级 ±0.1mm 可放宽;厚度对得上即可。' : '') + '" '
        +   'style="width:100%;margin-bottom:.4rem;padding:.5rem;font-size:.88rem;line-height:1.55;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-family:inherit;'
        +          (isEmpty ? 'border-color:#f59e0b;background:#fffbeb;' : 'background:#fafafa;') + '">' + escHtml(currentPrompt) + '</textarea>'
        + '<div style="font-size:.72rem;color:#9ca3af;margin-bottom:.8rem;">'
        + (isEmpty ? '💡 还没填过 → 保存后会写入 category_prompts 表,下次 AI 判别自动加载。' : '💡 改完保存 → 会更新 category_prompts 表当前分类的提示词。')
        + '</div>'
        + '<div style="text-align:right;">'
        + '<button id="cp_cancel" type="button" style="margin-right:.4rem;padding:.4rem .8rem;background:#dfe6e9;border:none;border-radius:4px;cursor:pointer;">取消</button>'
        + '<button id="cp_save" type="button" style="padding:.4rem 1rem;background:#7c3aed;color:#fff;border:none;border-radius:4px;cursor:pointer;">保存</button>'
        + '</div>'
        + '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    var modal = document.getElementById('categoryPromptModal');
    var close = function() { modal.remove(); };
    document.getElementById('cp_close_x').onclick = close;
    document.getElementById('cp_cancel').onclick = close;
    // 点击背景关闭
    modal.onclick = function(e) { if (e.target === modal) close(); };
    // 保存
    document.getElementById('cp_save').onclick = function() {
        var promptText = document.getElementById('cp_prompt_text').value || '';
        var saveBtn = document.getElementById('cp_save');
        saveBtn.disabled = true; saveBtn.textContent = '保存中...';
        var onDone = function(data) {
            saveBtn.disabled = false; saveBtn.textContent = '保存';
            if (data && data.success) {
                modal.remove();
                alert('已保存,下次同类比对生效');
            } else { alert('保存失败: ' + ((data && data.error) || '')); }
        };
        var onErr = function() { saveBtn.disabled = false; saveBtn.textContent = '保存'; alert('请求失败'); };
        // 已有提示词 → PATCH 更新(不新增);否则 POST 新建
        if (sug.existing_prompt_id) {
            fetch('/api/v1/manage/category-prompts/' + sug.existing_prompt_id, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt_text: promptText})
            }).then(function(r){ return r.json(); }).then(onDone).catch(onErr);
        } else {
            var body = {
                scope: 'category',  // 2026-08-09 简化:只支持大类 scope
                category_code: sug.category_code || null,
                product_name_keyword: sug.product_name_keyword || null,
                spec_pattern: null,
                prompt_text: promptText,
                source_ocr_text: sug.source_ocr_text,
                source_ai_status: sug.source_ai_status,
                source_human_status: 'green',
            };
            fetch('/api/v1/category-prompts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            }).then(function(r){ return r.json(); }).then(onDone).catch(onErr);
        }
    };
}

// 23. openOcrDetailModal — 打开 OCR/AI/人工比对详情弹窗
function openOcrDetailModal(d) {
    var existing = document.getElementById('ocrDetailModal');
    if (existing) existing.remove();
    function fmtJson(s) {
        if (!s) return '(空)';
        try { var o = JSON.parse(s); return JSON.stringify(o, null, 2); }
        catch (e) { return s; }
    }
    function section(title, contentHtml) {
        return '<div style="margin:.5rem 0 1rem;">'
             + '<div style="font-weight:600;font-size:.85rem;color:#2d3436;margin-bottom:.3rem;">' + title + '</div>'
             + '<pre style="background:#f5f5f5;padding:.55rem;border:1px solid #e0e0e0;border-radius:4px;white-space:pre-wrap;word-break:break-all;font-size:.78rem;line-height:1.45;max-height:300px;overflow:auto;margin:0;">'
             + contentHtml + '</pre></div>';
    }
    var ocrHtml = d.ocr
        ? 'OCR 引擎: ' + (d.ocr.ocr_engine || 'paddleocr') + '\n'
          + '本地匹配裁决: ' + (d.ocr.ai_match_status || '-') + '   (RapidFuzz 字符串相似度,本地 CPU 跑,无需联网)\n'
          + '本地匹配原因: ' + (d.ocr.ai_match_reason || '-') + '\n'
          + '时间: ' + (d.ocr.created_at || '-') + '\n'
          + '────────────── OCR 原文 ──────────────\n'
          + (d.ocr.ocr_text || '(空)')
        : '(此图暂无 record_ocr 事件)';
    var aiHtml = d.ai
        ? 'AI 引擎: ' + (d.ai.ai_engine || '-') + '   (云端大模型,需联网,每次调用消耗 token)\n'
          + 'Prompt 版本: ' + (d.ai.prompt_version || '-') + '\n'
          + '云端裁决: ' + (d.ai.ai_match_status || '-') + '\n'
          + '云端原因: ' + (d.ai.ai_match_reason || '-') + '\n'
          + '时间: ' + (d.ai.created_at || '-') + '\n'
          + (d.ai.ocr_text ? '────────────── 关联 OCR 原文 ──────────────\n' + d.ai.ocr_text + '\n' : '')
          + '────────────── 提示词(完整 prompt) ──────────────\n'
          + (d.ai.prompt_payload || '(空)')
        : '(此 record 还没跑过 AI 判别,即用户从未点过「🤖 AI 匹配」或「AI判别」按钮 → 没调过云端)';
    var deepseekHtml = d.ai
        ? '────────────── DeepSeek 原始返回 JSON ──────────────\n' + fmtJson(d.ai.ai_raw_response)
        : '';
    var humanHtml = d.human
        ? '人工裁决: ' + (d.human.human_status || '-') + '\n'
          + '人工备注: ' + (d.human.human_reason || '(无)') + '\n'
          + '操作员: ' + (d.human.operator_name || '-') + '\n'
          + '时间: ' + (d.human.created_at || '-')
        : '(未核查)';

    var html = ''
        + '<div id="ocrDetailModal" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;">'
        + '<div style="background:#fff;border-radius:8px;padding:1.2rem;max-width:760px;width:94%;max-height:88vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.25);">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;">'
        + '<h3 style="margin:0;color:#2d3436;">图片比对详情 # ' + escHtml(String(d.image_id)) + '</h3>'
        + '<button id="ocr_detail_close" style="background:#dfe6e9;border:none;border-radius:4px;padding:.2rem .6rem;cursor:pointer;font-size:.9rem;">×</button>'
        + '</div>'
        + '<div style="font-size:.82rem;color:#636e72;margin-bottom:.6rem;">'
        + '订单 #' + escHtml(String(d.order_id || '-')) + ' · 记录 #' + escHtml(String(d.record_id || '-')) + ' · '
        + '品名 <b>' + escHtml(d.product_name || '-') + '</b> · 规格 <b>' + escHtml(d.specification || '-') + '</b> · '
        + '当前 AI 裁决 <b>' + escHtml(d.effective_match_status || d.match_status || '(无)') + '</b>' + (d.human_verified && d.match_status && d.match_status !== d.effective_match_status ? ' (人工覆盖原始 ' + escHtml(d.match_status) + ')' : '') + '</div>'
        + section('1️⃣ OCR 原文(PaddleOCR 抽取)', escHtml(ocrHtml))
        + section('2️⃣ 提示词(实际发给 DeepSeek 的完整 prompt)', escHtml(aiHtml))
        + section('3️⃣ 推理结果(DeepSeek 原始返回 JSON + 人工裁决)', escHtml(deepseekHtml + '\n\n' + humanHtml))
        + '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
    document.getElementById('ocr_detail_close').onclick = function() {
        document.getElementById('ocrDetailModal').remove();
    };
}
